spring.application.name=bailemi-spring
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bailemi?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=bailemi-secret-key-change-in-production-environment-must-be-at-least-256-bits
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=2592000000

# Logging
logging.level.com.bailemi=DEBUG
logging.level.org.springframework.security=DEBUG
